apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: webapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: jayakrishnanjk/nginx-php-kubernetes-cicd-nginx:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
